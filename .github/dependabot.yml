version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Playwright 1.56.1 is tied to the chromium of the ubuntu-24.04 runner (see ci.yml); bump by hand.
      - dependency-name: playwright
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
