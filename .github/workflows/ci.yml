name: Hub checks and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04  # ubuntu-latest = 26.04: Playwright 1.56.1 has no chromium for it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Cloudflare Worker dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test WebAuthn and session worker
        run: npm test
      - name: Check GitHub transports in the actual Worker runtime
        run: node --test tests/workerd-redirect.cjs
      - name: Dry-run Worker bundle (no Cloudflare login)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry"
      - name: Build allowlisted public site
        run: python3 tools/build-site.py --output "$RUNNER_TEMP/hub-public"
      - name: Check public artifact contents and local paths
        run: python3 tests/check-site-artifact.py
      - name: Check CSP and browser-safe rendering
        run: node tests/check-csp.cjs
      - name: Validate release catalog
        run: node tests/check-downloads.cjs
      - name: Check opt-in legacy Pages redirects
        run: python3 tests/check-pages-redirect.py
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check interactive board browser contract
        run: node tests/board-ui-contract.cjs
      - name: Check Hub browser against actual Worker and SQLite
        run: node --experimental-sqlite tests/hub-acceptance-browser.cjs
      - name: Check persisted pending recovery through existing delivery API
        run: node --experimental-sqlite tests/hub-acceptance-resume.cjs
      - name: Check dashboard homepage, navigation, logout and responsive layout
        run: node tests/dashboard-first.cjs
      - name: Check trusted secretary responses and logout races
        run: node tests/issue-responses-ui.cjs
      - name: Upload synthetic Hub acceptance screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-acceptance-screenshots
          path: artifacts/hub/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Allow the local mock API to bind HTTPS port 443
        run: sudo setcap cap_net_bind_service=+ep "$(command -v node)"
      - name: Check subpath behavior of the deployable artifact
        env:
          HUB_SITE_ROOT: ${{ runner.temp }}/hub-public
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/check-subpath.cjs
      - name: Run browser tests against the deployable artifact and local API mock
        env:
          HUB_SITE_ROOT: ${{ runner.temp }}/hub-public
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/e2e.cjs
      - name: Upload login theme screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: login-theme-screenshots
          path: tests/shots/login-390-*.png
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04  # ubuntu-latest = 26.04: Playwright 1.56.1 has no chromium for it
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Build allowlisted public site
        run: python3 tools/build-site.py --output "$RUNNER_TEMP/hub-public" --redirect-to "https://kolobovdjp.org/hub/"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/hub-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
