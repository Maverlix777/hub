name: Hub checks and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04  # ubuntu-latest = 26.04: Playwright 1.56.1 has no chromium for it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install Cloudflare Worker dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test WebAuthn and session worker
        run: npm test
      - name: Dry-run Worker bundle (no Cloudflare login)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry"
      - name: Build allowlisted public site
        run: python3 tools/build-site.py --output "$RUNNER_TEMP/hub-public"
      - name: Check public artifact contents and local paths
        run: python3 tests/check-site-artifact.py
      - name: Check CSP and browser-safe rendering
        run: node tests/check-csp.cjs
      - name: Validate release catalog
        run: node tests/check-downloads.cjs
      - name: Check opt-in legacy Pages redirects
        run: python3 tests/check-pages-redirect.py
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check interactive board browser contract
        run: node tests/board-ui-contract.cjs
      - name: Check Hub browser against actual Worker and SQLite
        run: node --experimental-sqlite tests/hub-acceptance-browser.cjs
      - name: Upload synthetic Hub acceptance screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-acceptance-screenshots
          path: artifacts/hub/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Allow the local mock API to bind HTTPS port 443
        run: sudo setcap cap_net_bind_service=+ep "$(command -v node)"
      - name: Check subpath behavior of the deployable artifact
        env:
          HUB_SITE_ROOT: ${{ runner.temp }}/hub-public
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/check-subpath.cjs
      - name: Run browser tests against the deployable artifact and local API mock
        env:
          HUB_SITE_ROOT: ${{ runner.temp }}/hub-public
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/e2e.cjs
      - name: Upload login theme screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: login-theme-screenshots
          path: tests/shots/login-390-*.png
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04  # ubuntu-latest = 26.04: Playwright 1.56.1 has no chromium for it
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Build allowlisted public site
        run: python3 tools/build-site.py --output "$RUNNER_TEMP/hub-public" --redirect-to "https://kolobovdjp.org/hub/"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/hub-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
