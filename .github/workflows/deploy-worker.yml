name: Deploy Worker

# DANGER: production kolobovdjp-hub is a PRIVATE build (owner-download, notifications,
# gateway auth) that does not exist in this public repo. Deploying main from here
# overwrites it and breaks /hub/* (this happened 2026-10-21, 13:53-14:12 UTC, and was
# rolled back by hand). Run only if you really mean to replace the private build;
# the `confirm` input must be typed exactly, and --keep-vars keeps existing Worker vars.

# Manual only. Every run is a production deploy of kolobovdjp-hub and needs the
# owner's explicit go for that run; nothing here fires on push.
#
# Required repository secrets (never read or printed by this workflow's steps):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional repository variables:
#   HUB_D1_DATABASE_ID   id of the `hub-auth` D1 database; when unset it is looked up by name with `wrangler d1 list`
#   HUB_WORKER_ROUTES    comma-separated zone routes, e.g. "kolobovdjp.org/hub,kolobovdjp.org/hub/*,kolobovdjp.org/doktor/*".
#                        The `routes` run input overrides it. When both are empty, existing routes are left untouched
#                        (wrangler only syncs routes present in config).
#
# The checked-in wrangler.jsonc stays a template with a placeholder D1 id; the
# deployable config is generated into $RUNNER_TEMP and never committed.

on:
  workflow_dispatch:
    inputs:
      prepare_only_933:
        description: Offline #933 asset/config contract only; cannot upload or activate
        type: boolean
        default: false
      stage_inactive_933:
        description: Stage exact reviewed #933 assets as an INACTIVE version; no activation
        type: boolean
        default: false
      reviewed_sha:
        description: Exact approved #933 merged source SHA
        type: string
        default: ''
      apply_migrations:
        description: Apply D1 migrations (hub-auth, remote) before deploying
        type: boolean
        default: true
      routes:
        description: Comma-separated zone routes to sync (empty = leave routes untouched)
        type: string
        default: ''
      confirm:
        description: 'Type exactly: OVERWRITE PRIVATE PRODUCTION BUILD'
        type: string
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  prepare-only-933:
    if: ${{ inputs.prepare_only_933 && !inputs.stage_inactive_933 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require preparation-only scope and operational branch
        env:
          CONFIRM: ${{ inputs.confirm }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/zhanna/933-assets-only-deploy
          test "$CONFIRM" = 'PREPARE #933 OFFLINE ONLY'
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: operations
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_sha }}
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: operations/package-lock.json
      - name: Install locked uploader and test offline guards
        working-directory: operations
        env:
          WRANGLER_SEND_METRICS: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          npm ci
          python3 tests/hub-933-assets-prepare-test.py -v
          python3 tests/hub-933-direct-candidate-test.py -v
          python3 tests/hub-933-stage-runner-test.py -v
      - name: Prove32-asset staging and actual no-bundle multipart offline
        working-directory: operations
        env:
          WRANGLER_SEND_METRICS: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: python3 tools/hub-933-assets-prepare.py --offline-runtime-repo ../runtime --reviewed-sha "$REVIEWED_SHA" --out "$RUNNER_TEMP/hub-933-offline"
  stage-inactive-933:
    if: ${{ inputs.stage_inactive_933 && !inputs.prepare_only_933 }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require exact inactive staging scope and approved source
        env:
          CONFIRM: ${{ inputs.confirm }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          ROUTES: ${{ inputs.routes }}
        run: |
          test "$GITHUB_REF" = refs/heads/zhanna/933-assets-only-deploy
          test "$CONFIRM" = 'STAGE #933 INACTIVE ONLY'
          test "$REVIEWED_SHA" = 78546f13bc99401fc6f4acc11a175befcd61b933
          test "$APPLY_MIGRATIONS" = false
          test -z "$ROUTES"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: operations
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_sha }}
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: operations/package-lock.json
      - name: Install locked builder and exercise offline safety guards
        working-directory: operations
        env:
          WRANGLER_SEND_METRICS: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          npm ci
          python3 tests/hub-933-assets-prepare-test.py -v
          python3 tests/hub-933-direct-candidate-test.py -v
          python3 tests/hub-933-stage-runner-test.py -v
      - name: Stage single inactive candidate with exact live snapshot guards
        working-directory: operations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUB_933_CONFIRM: ${{ inputs.confirm }}
          HUB_933_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          WRANGLER_SEND_METRICS: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/hub-933-stage-runner.py --runtime-repo ../runtime --summary "$RUNNER_TEMP/hub-933-redacted-summary.json"
      - name: Upload only redacted candidate summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-933-redacted-candidate-summary
          path: ${{ runner.temp }}/hub-933-redacted-summary.json
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: ${{ !inputs.prepare_only_933 && !inputs.stage_inactive_933 && inputs.confirm == 'OVERWRITE PRIVATE PRODUCTION BUILD' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require explicit overwrite confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "OVERWRITE PRIVATE PRODUCTION BUILD" ]; then
            echo "::error::Refusing to deploy. Production kolobovdjp-hub is a private build that this public repo does not contain; deploying main overwrites it. To proceed, set input 'confirm' to exactly: OVERWRITE PRIVATE PRODUCTION BUILD"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Cloudflare Worker dependencies
        run: npm ci
      - name: Test WebAuthn and session worker
        run: npm test
      - name: Check required deploy settings are present
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          ok=1
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is missing"; ok=0; }
          [ "$HAS_ACCOUNT" = "true" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is missing"; ok=0; }
          [ "$ok" = 1 ]
      - name: Resolve the hub-auth D1 database id
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUB_D1_DATABASE_ID: ${{ vars.HUB_D1_DATABASE_ID }}
        run: |
          npx wrangler whoami
          if [ -z "$HUB_D1_DATABASE_ID" ]; then
            HUB_D1_DATABASE_ID="$(npx wrangler d1 list --json | python3 -c 'import json,sys; dbs=json.load(sys.stdin); print(next((d.get("uuid") or d.get("database_id") or "" for d in dbs if d.get("name")=="hub-auth"), ""))')"
          fi
          [ -n "$HUB_D1_DATABASE_ID" ] || { echo "::error::could not resolve the hub-auth D1 database id"; exit 1; }
          echo "::add-mask::$HUB_D1_DATABASE_ID"
          echo "id=$HUB_D1_DATABASE_ID" >> "$GITHUB_OUTPUT"
      - name: Generate the gitignored production config
        env:
          HUB_D1_DATABASE_ID: ${{ steps.d1.outputs.id }}
          HUB_WORKER_ROUTES: ${{ inputs.routes != '' && inputs.routes || vars.HUB_WORKER_ROUTES }}
          OUT: wrangler.production.local.jsonc
        run: |
          python3 - <<'PY'
          import json, os, re
          d1 = os.environ["HUB_D1_DATABASE_ID"].strip()
          if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", d1) or set(d1) <= set("0-"):
              raise SystemExit("HUB_D1_DATABASE_ID is not a real D1 database id")
          cfg = json.load(open("wrangler.jsonc"))
          cfg.pop("$schema", None)
          for db in cfg["d1_databases"]:
              if db["binding"] == "HUB_DB":
                  db["database_id"] = d1
          routes = [r.strip() for r in os.environ.get("HUB_WORKER_ROUTES", "").split(",") if r.strip()]
          if routes:
              cfg["routes"] = [{"pattern": r, "zone_name": r.split("/", 1)[0]} for r in routes]
          with open(os.environ["OUT"], "w") as f:
              json.dump(cfg, f, indent=2)
          print("routes in config:", routes or "(unchanged)")
          PY
      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply hub-auth --remote --config wrangler.production.local.jsonc
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars --config wrangler.production.local.jsonc
      - name: Smoke-check security headers on the live route
        run: |
          ORIGIN="$(grep -o '"CANONICAL_ORIGIN": *"[^"]*"' wrangler.jsonc | head -n1 | sed 's/.*: *"\(.*\)"/\1/')"
          ORIGIN="${ORIGIN:-https://hub.kolobovdjp.org}"
          echo "smoke-check origin: $ORIGIN"
          curl -sSI --max-time 20 "${ORIGIN}/hub/style.css" | tr -d '\r' | tee "$RUNNER_TEMP/headers.txt"
          grep -qi '^referrer-policy: no-referrer' "$RUNNER_TEMP/headers.txt"
