name: Deploy Worker

# Manual only. Every run is a production deploy of kolobovdjp-hub and needs the
# owner's explicit go for that run; nothing here fires on push.
#
# Required repository secrets (never read or printed by this workflow's steps):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Required repository variable (Settings → Secrets and variables → Actions → Variables):
#   HUB_D1_DATABASE_ID   real id of the `hub-auth` D1 database
# Optional repository variable:
#   HUB_WORKER_ROUTES    comma-separated zone routes, e.g. "kolobovdjp.org/hub,kolobovdjp.org/hub/*,kolobovdjp.org/doktor/*".
#                        When unset, existing routes are left untouched (wrangler only syncs routes present in config).
#
# The checked-in wrangler.jsonc stays a template with a placeholder D1 id; the
# deployable config is generated into $RUNNER_TEMP and never committed.

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply D1 migrations (hub-auth, remote) before deploying
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install Cloudflare Worker dependencies
        run: npm ci
      - name: Test WebAuthn and session worker
        run: npm test
      - name: Check required deploy settings are present
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_D1: ${{ vars.HUB_D1_DATABASE_ID != '' }}
        run: |
          ok=1
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is missing"; ok=0; }
          [ "$HAS_ACCOUNT" = "true" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is missing"; ok=0; }
          [ "$HAS_D1" = "true" ] || { echo "::error::repository variable HUB_D1_DATABASE_ID is missing"; ok=0; }
          [ "$ok" = 1 ]
      - name: Generate the gitignored production config
        env:
          HUB_D1_DATABASE_ID: ${{ vars.HUB_D1_DATABASE_ID }}
          HUB_WORKER_ROUTES: ${{ vars.HUB_WORKER_ROUTES }}
          OUT: wrangler.production.local.jsonc
        run: |
          python3 - <<'PY'
          import json, os, re
          d1 = os.environ["HUB_D1_DATABASE_ID"].strip()
          if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", d1) or set(d1) <= set("0-"):
              raise SystemExit("HUB_D1_DATABASE_ID is not a real D1 database id")
          cfg = json.load(open("wrangler.jsonc"))
          cfg.pop("$schema", None)
          for db in cfg["d1_databases"]:
              if db["binding"] == "HUB_DB":
                  db["database_id"] = d1
          routes = [r.strip() for r in os.environ.get("HUB_WORKER_ROUTES", "").split(",") if r.strip()]
          if routes:
              cfg["routes"] = [{"pattern": r, "zone_name": r.split("/", 1)[0]} for r in routes]
          with open(os.environ["OUT"], "w") as f:
              json.dump(cfg, f, indent=2)
          print("routes in config:", routes or "(unchanged)")
          PY
      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply hub-auth --remote --config wrangler.production.local.jsonc
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.local.jsonc
      - name: Smoke-check security headers on the live route
        run: |
          curl -sSI --max-time 20 https://kolobovdjp.org/hub/style.css | tr -d '\r' | tee "$RUNNER_TEMP/headers.txt"
          grep -qi '^referrer-policy: no-referrer' "$RUNNER_TEMP/headers.txt"
