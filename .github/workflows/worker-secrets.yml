name: Worker secrets

# Manual only. Lists the NAMES of encrypted secrets on the Worker and, when
# `put_name` is set, copies the GitHub secret with the same name into the Worker.
# Values are never printed. No code is deployed. Only allowlisted names can be put;
# VAPID_PRIVATE_KEY is deliberately not allowed (it stays in GitHub secrets only).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      put_name:
        description: 'Optional: HUB_ISSUES_TASK_ROUTES, PUSH_DELIVERY_TOKEN or VAPID_PUBLIC_KEY'
        type: string
        default: ''
      script:
        description: 'Worker script name (default kolobovdjp-hub-next; kolobovdjp-hub allowed)'
        type: string
        default: 'kolobovdjp-hub-next'

permissions:
  contents: read

concurrency:
  group: worker-secrets
  cancel-in-progress: false

jobs:
  secrets:
    if: github.repository == 'Maverlix777/hub'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ inputs.script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate input
        env:
          PUT_NAME: ${{ inputs.put_name }}
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in
            kolobovdjp-hub-next|kolobovdjp-hub) ;;
            *) echo "::error::script is not in the allowlist"; exit 1 ;;
          esac
          case "$PUT_NAME" in
            ''|HUB_ISSUES_TASK_ROUTES|PUSH_DELIVERY_TOKEN|VAPID_PUBLIC_KEY) ;;
            *) echo "::error::put_name is not in the allowlist"; exit 1 ;;
          esac
      - name: Put secret into the Worker
        if: ${{ inputs.put_name != '' }}
        env:
          PUT_NAME: ${{ inputs.put_name }}
          HUB_ISSUES_TASK_ROUTES: ${{ secrets.HUB_ISSUES_TASK_ROUTES }}
          PUSH_DELIVERY_TOKEN: ${{ secrets.PUSH_DELIVERY_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          VALUE="${!PUT_NAME}"
          [ -n "$VALUE" ] || { echo "::error::GitHub secret $PUT_NAME is empty or missing"; exit 1; }
          printf '%s' "$VALUE" | npx wrangler secret put "$PUT_NAME" --name "$WORKER_NAME" >/dev/null
          echo "put: $PUT_NAME"
      - name: List Worker secret names
        run: npx wrangler secret list --name "$WORKER_NAME" --format json | python3 -c 'import json,sys; [print(s.get("name")) for s in json.load(sys.stdin)]'
