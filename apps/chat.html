<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.anthropic.com; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Чат — Хаб</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="chat.css">
</head>
<body>
<header class="bar">
  <a class="btn" id="hub" href="../index.html">← Хаб</a>
  <h1>Чат</h1>
  <button type="button" id="clear">Очистить</button>
</header>
<main class="chat">
  <details id="settings" class="settings">
    <summary>Настройки</summary>
    <div class="row">
      <label for="key">API-ключ</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
      <button type="button" id="saveKey">Сохранить</button>
      <button type="button" id="forgetKey">Забыть ключ</button>
    </div>
    <p id="keyState" class="hint"></p>
    <div class="row">
      <label for="model">Модель</label>
      <select id="model">
        <option value="claude-sonnet-5-5">claude-sonnet-5-5</option>
        <option value="claude-haiku-5-5">claude-haiku-5-5</option>
        <option value="claude-opus-5-5">claude-opus-5-5</option>
      </select>
    </div>
    <label for="system">Системный промпт</label>
    <textarea id="system" rows="3"></textarea>
  </details>
  <ol id="log" class="log" aria-live="polite"></ol>
  <div class="composer">
    <textarea id="input" rows="2" placeholder="Сообщение (Ctrl/⌘+Enter — отправить)"></textarea>
    <button type="button" id="send" class="primary">Отправить</button>
    <button type="button" id="stop" hidden>Стоп</button>
  </div>
</main>
<script src="chat.js"></script>
</body>
</html>
